<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HabitFlow - Construa os seus Hábitos</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/x-icon" href="img/favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="img/favicon/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="img/favicon/apple-touch-icon.png">
</head>
<body class="pagina-inicial">

  <main class="tela-inicial" aria-label="Tela inicial do HabitFlow">
    <h1 class="sr-only">HabitFlow - Construa os seus hábitos</h1>
    <button type="button" class="btn-tela" id="btn-login">Login</button>
    <a href="app.html" class="btn-tela" id="btn-entrar">Entrar</a>
  </main>

  <div class="modal-fundo" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
    <div class="modal" id="modal-caixa">
      <button type="button" class="fechar" id="btn-fechar" aria-label="Fechar">&times;</button>
      <h2 id="modal-titulo">Acesse sua conta</h2>
      <p class="sub" id="modal-sub">Entre com seu e-mail e senha.</p>

      <div class="abas">
        <button type="button" class="aba ativa" id="aba-login">Login</button>
        <button type="button" class="aba" id="aba-cadastro">Criar conta</button>
      </div>

      <form id="form-auth" novalidate>
        <div class="campo-nome">
          <label for="auth-nome">Nome</label>
          <input type="text" id="auth-nome" autocomplete="name" placeholder="Seu nome">
        </div>
        <label for="auth-email">E-mail</label>
        <input type="email" id="auth-email" autocomplete="email" placeholder="voce@email.com" required>
        <label for="auth-senha">Senha</label>
        <input type="password" id="auth-senha" autocomplete="current-password" placeholder="Mínimo 4 caracteres" required>
        <p class="erro" id="auth-erro" role="alert"></p>
        <button type="submit" class="btn-enviar" id="btn-enviar">Entrar</button>
      </form>
    </div>
  </div>

  <script src="js/script.js" defer></script>
</body>
</html>
